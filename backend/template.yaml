AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CFB Pick'em backend - fetches weekly games from ESPN, collects picks,
  grades results. Name-based login (no password), built for a friend group.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        GAMES_TABLE: !Ref GamesTable
        PICKS_TABLE: !Ref PicksTable
        NUM_GAMES_PER_WEEK: '10'

Parameters:
  StageName:
    Type: String
    Default: prod
  # ESPN's "groups=80" corresponds to FBS. Change if you want FCS or all of D1.
  EspnGroupId:
    Type: String
    Default: '80'

Resources:

  ##########################################################################
  # DynamoDB
  ##########################################################################

  UsersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: name
        Type: String

  # PK: weekId (e.g. "2026-09-07")   SK: gameId (ESPN event id)
  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: weekId
          AttributeType: S
        - AttributeName: gameId
          AttributeType: S
      KeySchema:
        - AttributeName: weekId
          KeyType: HASH
        - AttributeName: gameId
          KeyType: RANGE

  # PK: weekId#userName   SK: gameId
  PicksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: weekUser
          AttributeType: S
        - AttributeName: gameId
          AttributeType: S
        - AttributeName: weekId
          AttributeType: S
      KeySchema:
        - AttributeName: weekUser
          KeyType: HASH
        - AttributeName: gameId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byWeek
          KeySchema:
            - AttributeName: weekId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ##########################################################################
  # API
  ##########################################################################

  PickemApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "content-type"
          - "authorization"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/loginUser.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /login
            Method: POST

  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/signupUser.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /signup
            Method: POST

  GetCurrentWeekGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/getGames.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
      Events:
        CurrentApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /games/current
            Method: GET
        ByWeekApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /games/{weekId}
            Method: GET

  SubmitPicksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/submitPicks.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /picks
            Method: POST

  GetPicksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/getPicks.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PicksTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /picks/{weekId}/{userName}
            Method: GET

  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/getLeaderboard.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref PickemApi
            Path: /leaderboard
            Method: GET

  ##########################################################################
  # Scheduled jobs
  ##########################################################################

  # Every Monday 8am UTC: pull this week's slate from ESPN, pick 10 games
  # with the closest spreads, and store them.
  FetchWeeklyGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/fetchWeeklyGames.handler
      Timeout: 30
      Environment:
        Variables:
          ESPN_GROUP_ID: !Ref EspnGroupId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * MON *)
            Name: cfb-pickem-fetch-weekly-games
            Description: Pulls this week's 10 closest-spread CFB games from ESPN

  # Every Sunday 11pm UTC: pull final scores and grade the week's picks.
  GradeWeekFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src
      Handler: handlers/gradeWeek.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PicksTable
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 23 ? * SUN *)
            Name: cfb-pickem-grade-week
            Description: Grades the week's picks against final ESPN scores

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API (put this in the frontend's VITE_API_BASE_URL)
    Value: !Sub "https://${PickemApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
